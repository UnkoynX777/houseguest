name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use a private advisory (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Houseguest version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows edition and build
      description: Shown in Diagnostics
      placeholder: Windows 11 Pro 26100
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: Diagnostics → Copy report. Remove anything you consider private.
      render: json
