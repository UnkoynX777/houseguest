name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Houseguest to do?
  - type: textarea
    id: limits
    attributes:
      label: Windows limitations you know of
      description: Which official mechanism could support this? Houseguest does not use stealth or undocumented techniques.
