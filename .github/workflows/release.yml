name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Dependency inventory
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/dependency-graph/sbom --jq .sbom | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/Houseguest-sbom.spdx.json"
      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/package.ps1 -Version $version -ExtraFiles "$env:RUNNER_TEMP/Houseguest-sbom.spdx.json"
      - name: Verify checksums
        shell: bash
        working-directory: dist
        run: |
          if grep -q $'\r' SHA256SUMS.txt; then echo 'SHA256SUMS.txt must use LF line endings'; exit 1; fi
          sha256sum -c SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: houseguest-${{ github.ref_name }}
          path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = '(?ms)^## \[' + [regex]::Escape($version) + '\][^\n]*\n(.*?)(?=^## \[|\z)'
          $section = [regex]::Match($changelog, $pattern).Groups[1].Value.Trim()
          if (-not $section) { throw "CHANGELOG.md has no section for $version" }
          $footer = 'Unsigned build. Verify downloads with `sha256sum -c SHA256SUMS.txt` and `gh attestation verify <file> --repo ${{ github.repository }}`.'
          $notes = $section + "`n`n" + $footer
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist -File).FullName --title '${{ github.ref_name }}' --notes $notes --verify-tag
      - name: Verify attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($file in Get-ChildItem dist -File | Where-Object { $_.Extension -in '.msi', '.zip' }) {
            for ($attempt = 1; $attempt -le 6; $attempt++) {
              gh attestation verify $file.FullName --repo ${{ github.repository }}
              if ($LASTEXITCODE -eq 0) { break }
              Start-Sleep -Seconds 20
            }
            if ($LASTEXITCODE -ne 0) { throw "Attestation for $($file.Name) could not be verified." }
          }
